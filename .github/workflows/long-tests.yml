name: Long tests

# The full randomized runs: the differential test of the move generator against the naive one on 100k+ positions
# per version for all 21 rolls, and 100k random games per variant with every invariant checked. They take a long
# time, so they run on demand (and before each release), not on every push.
on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BACKGAMMON_LONG: 1

jobs:
  long:
    name: Differential and property runs
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/Backgammon.slnx -c Release

      - name: Test
        working-directory: src
        run: dotnet test --solution Backgammon.slnx -c Release --no-build
